<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beauty Landing</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: gray;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 4vw, 40px);
    }

    .container {
      background-color: white;
      width: 100%;
      max-width: 860px;
      padding: clamp(12px, 4vw, 40px);
    }

    .main {
      background-color: white;
      border: clamp(8px, 2.5vw, 20px) solid grey;
      padding: clamp(10px, 2.5vw, 20px);
    }

    /* ---------- Nav ---------- */
    .nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 16px;
      font-family: Georgia, serif;
      padding: 4px 0 14px;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
    }

    .nav span {
      font-size: clamp(12px, 1.8vw, 16px);
      font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
      cursor: pointer;
    }

    .nav button {
      border-radius: 20px;
      border: 2px solid rgb(43, 42, 42);
      background-color: gray;
      font-family: Georgia, serif;
      font-size: clamp(12px, 1.8vw, 16px);
      padding: 8px 14px;
      cursor: pointer;
    }

    /* ---------- Hero (image + text on top) ---------- */
    .hero {
      position: relative;
    }

    .pic {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 20px;
    }

    .about {
      position: absolute;
      left: 6%;
      top: 50%;
      transform: translateY(-50%);
      max-width: 55%;
      color: rgb(3, 3, 3);
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      font-weight: bolder;
    }

    .about h1 {
      margin: 0 0 0.15em;
      font-size: clamp(18px, 4vw, 34px);
      line-height: 1.15;
    }

    .about p {
      margin: 0.6em 0 1em;
      font-size: clamp(12px, 1.8vw, 16px);
      line-height: 1.5;
    }

    .button2 {
      display: inline-block;
      border-radius: 20px;
      border: 1px solid rgb(43, 42, 42);
      background-color: gray;
      padding: 8px 18px;
      color: black;
      text-align: center;
      font-size: clamp(12px, 1.8vw, 16px);
      cursor: pointer;
    }

    /* ---------- Phones ---------- */
    @media (max-width: 600px) {
      .nav {
        justify-content: center;
        text-align: center;
      }

      .nav-links {
        justify-content: center;
      }

      .pic {
        aspect-ratio: 4 / 5;
      }

      .about {
        max-width: 80%;
        top: auto;
        bottom: 6%;
        transform: none;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="main">

      <div class="nav">
        <div class="nav-links">
          <span>Home</span>
          <span>About</span>
          <span>Services</span>

          <span>Articles</span>
        </div>
        <button>Contact Us</button>
      </div>

      <div class="hero">
        <img class="pic"
          src="https://fashionista.com/.image/MTk4NDU3OTI2MTY2MzI1MDc3/hailey-bieber-rhode-glazing-milk-campaign-1.jpg?profile=share16-9"
          alt="helly">

        <div class="about">
          <h1>JOIN OUR BEAUTY</h1>
          <h1>Better Results.</h1>

          <p>
            We create the idea of beauty
            <br>
            The idea that confidence holds beauty
            <br>
            Beauty in every glance
          </p>

          <div class="button2">Shop Now</div>
        </div>
      </div>

    </div>

  </div>

</body>

</html>
